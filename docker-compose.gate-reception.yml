version: '3.8'

services:
  # 访客管理系统主服务
  visitor-management-app:
    build:
      context: ./backend_service
      dockerfile: Dockerfile
    container_name: visitor-management-gate-reception
    ports:
      - "8000:8000"
    environment:
      # 数据库配置
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/visitor_management
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=visitor_management
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      
      # Redis配置
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      
      # JWT配置
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      
      # 应用配置
      - APP_NAME=访客管理系统-门岗前台
      - APP_VERSION=1.0.0
      - DEBUG=false
      - LOG_LEVEL=INFO
      
      # 门岗前台特定配置
      - GATE_VERIFICATION_TIMEOUT=30
      - GATE_OFFLINE_CACHE_HOURS=24
      - RECEPTION_NOTIFICATION_TIMEOUT=300
      - MOBILE_SYNC_INTERVAL=300
      - DEVICE_HEARTBEAT_INTERVAL=60
      
      # 文件上传配置
      - UPLOAD_MAX_SIZE=10485760  # 10MB
      - UPLOAD_ALLOWED_TYPES=jpg,jpeg,png,pdf
      - UPLOAD_STORAGE_PATH=/app/uploads
    
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    
    depends_on:
      - postgres
      - redis
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: visitor-management-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=visitor_management
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend_service/app/infrastructure/database/init:/docker-entrypoint-initdb.d
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visitor_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: visitor-management-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: visitor-management-nginx
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
      - ./uploads:/var/www/uploads
    
    depends_on:
      - visitor-management-app
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped

  # 门岗设备模拟器（用于测试）
  gate-simulator:
    build:
      context: ./simulators/gate
      dockerfile: Dockerfile
    container_name: gate-device-simulator
    ports:
      - "8001:8000"
    environment:
      - GATE_ID=GATE_SIM_001
      - GATE_NAME=门岗模拟器1号
      - API_BASE_URL=http://visitor-management-app:8000/api/v1
      - HEARTBEAT_INTERVAL=30
      - SIMULATION_MODE=true
    
    depends_on:
      - visitor-management-app
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped
    
    profiles: ["simulators", "testing"]

  # 前台设备模拟器（用于测试）
  reception-simulator:
    build:
      context: ./simulators/reception
      dockerfile: Dockerfile
    container_name: reception-device-simulator
    ports:
      - "8002:8000"
    environment:
      - RECEPTION_ID=RECEPTION_SIM_001
      - RECEPTION_NAME=前台模拟器1号
      - API_BASE_URL=http://visitor-management-app:8000/api/v1
      - HEARTBEAT_INTERVAL=30
      - SIMULATION_MODE=true
    
    depends_on:
      - visitor-management-app
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped
    
    profiles: ["simulators", "testing"]

  # 移动端模拟器（用于测试）
  mobile-simulator:
    build:
      context: ./simulators/mobile
      dockerfile: Dockerfile
    container_name: mobile-device-simulator
    ports:
      - "8003:8000"
    environment:
      - MOBILE_ID=MOBILE_SIM_001
      - MOBILE_NAME=移动端模拟器1号
      - API_BASE_URL=http://visitor-management-app:8000/api/v1
      - SYNC_INTERVAL=300
      - OFFLINE_MODE=false
    
    depends_on:
      - visitor-management-app
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped
    
    profiles: ["simulators", "testing"]

  # 监控和日志
  prometheus:
    image: prom/prometheus:latest
    container_name: visitor-management-prometheus
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped
    
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: visitor-management-grafana
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    
    depends_on:
      - prometheus
    
    networks:
      - visitor-management-network
    
    restart: unless-stopped
    
    profiles: ["monitoring"]

networks:
  visitor-management-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# 部署配置说明
# 
# 基础部署（生产环境）:
#   docker-compose -f docker-compose.gate-reception.yml up -d
#
# 包含设备模拟器（测试环境）:
#   docker-compose -f docker-compose.gate-reception.yml --profile simulators up -d
#
# 包含监控组件（完整环境）:
#   docker-compose -f docker-compose.gate-reception.yml --profile monitoring up -d
#
# 完整部署（所有组件）:
#   docker-compose -f docker-compose.gate-reception.yml --profile simulators --profile monitoring up -d
#
# 查看服务状态:
#   docker-compose -f docker-compose.gate-reception.yml ps
#
# 查看日志:
#   docker-compose -f docker-compose.gate-reception.yml logs -f visitor-management-app
#
# 停止服务:
#   docker-compose -f docker-compose.gate-reception.yml down
#
# 完全清理（包括数据）:
#   docker-compose -f docker-compose.gate-reception.yml down -v
#
# 服务访问地址:
# - API文档: http://localhost/docs
# - 健康检查: http://localhost/api/v1/health
# - 门岗模拟器: http://localhost:8001
# - 前台模拟器: http://localhost:8002
# - 移动端模拟器: http://localhost:8003
# - Grafana监控: http://localhost:3000 (admin/admin123)
# - Prometheus: http://localhost:9090 