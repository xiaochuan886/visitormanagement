<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访客管理系统 - Neumorphism风格登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --text-primary: #4a5568;
            --text-secondary: #718096;
            --accent-color: #667eea;
        }

        body {
            background: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .neu-card {
            background: var(--bg-color);
            border-radius: 20px;
            box-shadow: 
                20px 20px 40px var(--shadow-dark),
                -20px -20px 40px var(--shadow-light);
            padding: 40px;
            max-width: 420px;
            width: 100%;
        }

        .neu-input {
            background: var(--bg-color);
            border: none;
            border-radius: 15px;
            box-shadow: 
                inset 8px 8px 16px var(--shadow-dark),
                inset -8px -8px 16px var(--shadow-light);
            padding: 16px 20px;
            font-size: 16px;
            color: var(--text-primary);
            width: 100%;
            margin: 12px 0;
            outline: none;
            transition: all 0.3s ease;
        }

        .neu-input:focus {
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark),
                inset -6px -6px 12px var(--shadow-light);
        }

        .neu-input::placeholder {
            color: var(--text-secondary);
        }

        .neu-button {
            background: var(--bg-color);
            border: none;
            border-radius: 15px;
            box-shadow: 
                8px 8px 16px var(--shadow-dark),
                -8px -8px 16px var(--shadow-light);
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin: 20px 0;
        }

        .neu-button:hover {
            box-shadow: 
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
        }

        .neu-button:active {
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
        }

        .neu-button-primary {
            background: linear-gradient(135deg, var(--accent-color), #764ba2);
            color: white;
            box-shadow: 
                8px 8px 16px var(--shadow-dark),
                -8px -8px 16px var(--shadow-light);
        }

        .neu-button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                10px 10px 20px var(--shadow-dark),
                -10px -10px 20px var(--shadow-light);
        }

        .neu-icon {
            background: var(--bg-color);
            border-radius: 50%;
            box-shadow: 
                8px 8px 16px var(--shadow-dark),
                -8px -8px 16px var(--shadow-light);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 32px;
            color: var(--accent-color);
        }

        .neu-checkbox {
            position: relative;
            display: inline-block;
            width: 24px;
            height: 24px;
            margin-right: 12px;
        }

        .neu-checkbox input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .neu-checkbox-mark {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background: var(--bg-color);
            border-radius: 6px;
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
            transition: all 0.3s ease;
        }

        .neu-checkbox input:checked ~ .neu-checkbox-mark {
            background: var(--accent-color);
            box-shadow: 
                4px 4px 8px var(--shadow-dark),
                -4px -4px 8px var(--shadow-light);
        }

        .neu-checkbox-mark:after {
            content: "";
            position: absolute;
            display: none;
            left: 8px;
            top: 4px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .neu-checkbox input:checked ~ .neu-checkbox-mark:after {
            display: block;
        }

        .neu-social-button {
            background: var(--bg-color);
            border: none;
            border-radius: 12px;
            box-shadow: 
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
            padding: 12px;
            margin: 8px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .neu-social-button:hover {
            transform: translateY(-2px);
            box-shadow: 
                8px 8px 16px var(--shadow-dark),
                -8px -8px 16px var(--shadow-light);
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .shape {
            position: absolute;
            background: var(--bg-color);
            border-radius: 50%;
            box-shadow: 
                10px 10px 20px var(--shadow-dark),
                -10px -10px 20px var(--shadow-light);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 20%;
            right: 15%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 15%;
            left: 15%;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            width: 70px;
            height: 70px;
            bottom: 25%;
            right: 10%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 
                    8px 8px 16px var(--shadow-dark),
                    -8px -8px 16px var(--shadow-light),
                    0 0 0 0 rgba(102, 126, 234, 0.7);
            }
            70% {
                box-shadow: 
                    8px 8px 16px var(--shadow-dark),
                    -8px -8px 16px var(--shadow-light),
                    0 0 0 10px rgba(102, 126, 234, 0);
            }
            100% {
                box-shadow: 
                    8px 8px 16px var(--shadow-dark),
                    -8px -8px 16px var(--shadow-light),
                    0 0 0 0 rgba(102, 126, 234, 0);
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <!-- 浮动装饰形状 -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Neumorphism风格登录界面 -->
    <div class="neu-card">
        <!-- 头部图标 -->
        <div class="neu-icon pulse">
            <i class="fas fa-users"></i>
        </div>

        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-700 mb-2">访客管理系统</h1>
            <p class="text-gray-500 text-sm">Neumorphism 设计风格</p>
        </div>

        <!-- 登录表单 -->
        <form>
            <div class="mb-4">
                <input type="text" class="neu-input" placeholder="用户名" required>
            </div>

            <div class="mb-6">
                <input type="password" class="neu-input" placeholder="密码" required>
            </div>

            <!-- 选项 -->
            <div class="flex items-center justify-between mb-6">
                <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                    <div class="neu-checkbox">
                        <input type="checkbox">
                        <span class="neu-checkbox-mark"></span>
                    </div>
                    记住我
                </label>
                <a href="#" class="text-sm text-blue-600 hover:text-blue-800">忘记密码？</a>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="neu-button-primary">
                <i class="fas fa-sign-in-alt mr-2"></i>
                登录
            </button>

            <!-- 分割线 -->
            <div class="flex items-center my-8">
                <div class="flex-1 h-px bg-gradient-to-r from-transparent via-gray-400 to-transparent"></div>
                <span class="px-4 text-sm text-gray-500">或使用</span>
                <div class="flex-1 h-px bg-gradient-to-r from-transparent via-gray-400 to-transparent"></div>
            </div>

            <!-- 社交登录 -->
            <div class="flex justify-center space-x-4">
                <button type="button" class="neu-social-button">
                    <i class="fab fa-google text-red-500"></i>
                </button>
                <button type="button" class="neu-social-button">
                    <i class="fab fa-microsoft text-blue-500"></i>
                </button>
                <button type="button" class="neu-social-button">
                    <i class="fab fa-apple text-gray-700"></i>
                </button>
                <button type="button" class="neu-social-button">
                    <i class="fab fa-github text-gray-800"></i>
                </button>
            </div>
        </form>

        <!-- 底部链接 -->
        <div class="text-center mt-8 pt-6">
            <p class="text-sm text-gray-600">
                还没有账户？
                <a href="#" class="text-blue-600 hover:text-blue-800 font-medium">立即注册</a>
            </p>
        </div>
    </div>

    <!-- 底部信息 -->
    <div class="fixed bottom-4 left-4 text-xs text-gray-500">
        <p>Neumorphism Design</p>
        <p>© 2024 访客管理系统</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 登录按钮点击效果
            const loginButton = document.querySelector('.neu-button-primary');
            loginButton.addEventListener('click', function(e) {
                e.preventDefault();
                
                // 添加加载状态
                this.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
                this.style.pointerEvents = 'none';
                
                // 模拟登录过程
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-check mr-2"></i>登录成功';
                    this.style.background = 'linear-gradient(135deg, #4caf50, #45a049)';
                    
                    setTimeout(() => {
                        this.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>登录';
                        this.style.background = 'linear-gradient(135deg, var(--accent-color), #764ba2)';
                        this.style.pointerEvents = 'auto';
                    }, 1500);
                }, 2000);
            });

            // 社交登录按钮点击效果
            const socialButtons = document.querySelectorAll('.neu-social-button');
            socialButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const icon = this.querySelector('i');
                    const platform = icon.classList.contains('fa-google') ? 'Google' :
                                   icon.classList.contains('fa-microsoft') ? 'Microsoft' :
                                   icon.classList.contains('fa-apple') ? 'Apple' : 'GitHub';
                    
                    // 添加点击动画
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = 'translateY(-2px)';
                        alert(`Neumorphism 风格的 ${platform} 登录\n\n特点：\n• 柔和的阴影效果\n• 浮雕式的视觉层次\n• 简约的色彩搭配\n• 舒适的用户体验`);
                    }, 150);
                });
            });

            // 输入框焦点效果
            const inputs = document.querySelectorAll('.neu-input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.style.transform = 'scale(1)';
                });
            });

            // 复选框点击效果
            const checkbox = document.querySelector('.neu-checkbox input');
            checkbox.addEventListener('change', function() {
                const mark = this.nextElementSibling;
                if (this.checked) {
                    mark.style.transform = 'scale(1.1)';
                    setTimeout(() => {
                        mark.style.transform = 'scale(1)';
                    }, 200);
                }
            });

            // 鼠标移动视差效果
            document.addEventListener('mousemove', function(e) {
                const shapes = document.querySelectorAll('.shape');
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                shapes.forEach((shape, index) => {
                    const speed = (index + 1) * 0.5;
                    const xMove = (x - 0.5) * speed;
                    const yMove = (y - 0.5) * speed;
                    
                    shape.style.transform = `translate(${xMove}px, ${yMove}px)`;
                });
            });
        });
    </script>
</body>
</html>
