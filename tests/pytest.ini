[tool:pytest]
testpaths = api_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --html=reports/test_report.html
    --self-contained-html
    --capture=no
markers =
    auth: 认证相关测试
    visitors: 访客管理测试
    employees: 员工管理测试
    departments: 部门管理测试
    sites: 站点管理测试
    integration: 集成测试
    slow: 慢速测试
    concurrent: 并发测试
asyncio_mode = auto 